[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edr"
version = "1.0.0"
description = "EDR: Evolve-Distill-Retire — internalizing self-evolved scaffold repairs into small model weights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch==2.7.1",
    "transformers==4.53.0",
    "peft==0.15.2",
    "bitsandbytes==0.46.1",
    "accelerate==1.8.1",
    "datasets==3.6.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "tqdm==4.67.1",
    "safetensors==0.5.3",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers==4.1.0"]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
